<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXFX AI | Smart Trading Platform</title>
    <style>
        :root {
            --bg-dark: #000808;
            --bg-card: #102641;
            --bg-card-hover: #1b2642;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa8c2c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: Arial, sans-serif;
            direction: rtl;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #020817, var(--bg-card));
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        header h1 {
            color: var(--gold);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--gold-dark);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .card h2 {
            color: var(--gold);
            margin-bottom: 15px;
            font-size: 1.3rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 8px;
        }

        .ticker-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
