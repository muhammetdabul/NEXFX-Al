<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXFX AI - الأسواق الذكية والتحليل المالي</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #131b2e;
            --bg-card-hover: #1b2642;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa8c2c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #00d2ff;
            --success: #10b981;
            --danger: #ef4444;
            --border-color: rgba(212, 175, 55, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header & Navigation */
        header {
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
            100% { transform: scale(1.05); box-shadow: 0 0 20px rgba(212, 175, 55, 0.6); }
        }

        .logo-text h1 {
            font-size: 1.3rem;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .logo-text span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--gold);
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
        }

        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        .btn-solid {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border: none;
            color: var(--bg-dark);
        }

        .btn-solid:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Ticker Bar */
        .ticker-bar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 5%;
            display: flex;
            gap: 30px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .ticker-bar::-webkit-scrollbar {
            display: none;
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .ticker-item .positive { color: var(--success); }
        .ticker-item .negative { color: var(--danger); }

        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        @media (max-width: 968px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Sidebar / Markets */
        .sidebar h3 {
            font-size: 1rem;
            color: var(--gold);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .market-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .market-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .market-item:hover, .market-item.active {
            background: var(--bg-card-hover);
            border-color: var(--gold);
        }

        /* Workspace & Canvas Section */
        .workspace {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .timeframes {
            display: flex;
            gap: 5px;
        }

        .tf-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .tf-btn.active, .tf-btn:hover {
            background: var(--gold);
            color: var(--bg-dark);
            font-weight: bold;
        }

        /* Canvas Chart Container */
        .canvas-container {
            position: relative;
            width: 100%;
            height: 380px;
            background: #060911;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* NEXFX AI Hub Panel */
        .ai-hub-panel {
            background: linear-gradient(135deg, rgba(19, 27, 46, 0.95), rgba(10, 14, 23, 0.98));
        }

        .panel-title {
            font-size: 1.1rem;
            color: var(--gold);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-control {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--gold);
        }

        /* Outputs Section */
        .outputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .output-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
        }

        .output-box .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .output-box .value {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--gold-light);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border: none;
            border-radius: 8px;
            color: var(--bg-dark);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            opacity: 0.95;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* Monitoring Table */
        .monitoring-section {
            margin-top: 20px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.85rem;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--gold);
            background: rgba(255, 255, 255, 0.02);
        }

        td {
            color: var(--text-muted);
        }

        .empty-row {
            text-align: center;
            color: var(--text-muted);
            padding: 15px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }

        /* Auth Modal Simple Style */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--gold);
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
        }
        .modal-content h3 { color: var(--gold); margin-bottom: 15px; }
        .social-btn {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .social-btn:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); }
        .close-modal {
            margin-top: 15px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

            </div>
